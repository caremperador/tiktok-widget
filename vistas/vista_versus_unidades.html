<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0f13; color: white; font-family: 'Segoe UI', sans-serif; padding: 40px; margin: 0; }
        .box { background: #1a1a24; border: 1px solid #cc00ff; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(204,0,255,0.2); max-width: 900px; margin-bottom: 30px;}
        h3 { color: #cc00ff; margin-top: 0; border-bottom: 1px solid #cc00ff; padding-bottom: 10px; font-size: 18px; }
        
        .top-row { display: flex; gap: 40px; align-items: flex-start; margin-bottom: 25px;}
        .col-layout { display: flex; gap: 30px; }
        .team-col { flex: 1; display: flex; flex-direction: column; gap: 15px; padding: 25px; border-radius: 8px; border: 1px solid #333; background: #222;}
        
        label { font-weight: bold; font-size: 12px; text-transform: uppercase;}
        input[type="text"], input[type="number"], select { width: 100%; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 12px; font-size: 14px; box-sizing: border-box; }
        input[type="color"] { width: 100%; height: 40px; background: #000; border: 1px solid #444; border-radius: 6px; padding: 2px; cursor: pointer;}
        input:focus { border-color: #cc00ff; outline: none;}
        
        .checkbox-group { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; font-weight: bold; margin-bottom: 10px;}
        .checkbox-group input { width: 18px; height: 18px; accent-color: #cc00ff;}
        
        .btn-add { background: #444; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;}
        .btn-add:hover { background: #555; }
        
        .assigned-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .assigned-item { background: #111; border: 1px solid #cc00ff; padding: 6px 12px; border-radius: 6px; font-size: 13px; display: flex; gap: 10px; align-items: center;}
        .btn-remove { background: none; color: #ff003c; border: none; cursor: pointer; padding: 0; font-weight: bold;}
        
        .btn-guardar { width: 100%; padding: 18px; background: #cc00ff; color: white; font-size: 16px; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; text-transform: uppercase;}
        .btn-guardar:hover { filter: brightness(1.2);}
        
        .overlay-bar { display: flex; gap: 10px; margin-top: 15px; }
        .btn-overlay { flex: 1; padding: 12px 5px; background: #222; color: #cc00ff; font-size: 13px; font-weight: bold; border: 1px solid #cc00ff; cursor: pointer; border-radius: 8px;}
        .btn-overlay:hover { background: #cc00ff; color: white;}

        .design-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 15px;}
        .design-item { background: #111; padding: 15px; border-radius: 8px; border: 1px solid #444;}
        
        .color-selector { display: flex; gap: 8px; align-items: center; }
        .color-picker { width: 45px !important; padding: 0 !important; border: none !important; cursor: pointer; border-radius: 4px !important;}
        .color-hex { flex: 1; font-family: monospace; text-transform: uppercase; letter-spacing: 1px; }

        .manual-points-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 5px; }
        .mp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
        .mp-title { color:#aaa; font-weight:bold; font-size:12px; text-transform:uppercase;}
        .mp-score { font-size:24px; font-weight:900; text-shadow: 1px 1px 0 #000;}
        .mp-controls { display: flex; gap: 8px; }
        .mp-input { padding:10px !important; flex:1; background: #000 !important; }
        .btn-mp { border:none; border-radius:6px; font-weight:bold; cursor:pointer; padding: 0 15px; font-size: 16px;}
    </style>
</head>
<body>
    <div class="box">
        <h3><i class="fa-solid fa-cube"></i> Mecánicas de Batalla (Modo Unidades)</h3>
        <div class="top-row">
            <div style="flex: 0.4;">
                <label style="color: #cc00ff;"><i class="fa-solid fa-stopwatch"></i> Segundos Cuenta Atrás</label>
                <input type="number" id="input-countdown-sec" style="margin-bottom: 15px;">
                
                <button class="btn-clear" onclick="resetearValores()" style="width: 100%; background: #ff003c; color: white; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; box-shadow: 0 4px 10px rgba(255,0,60,0.4);"><i class="fa-solid fa-skull"></i> Resetear a 0 (Unidades)</button>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column;">
                <label class="checkbox-group"><input type="checkbox" id="check-countdown"> Activar Cuenta Regresiva</label>
                <p style="font-size: 13px; color: #ccc;">Este modo oculta las monedas y la barra. Se centra exclusivamente en contar los regalos asignados mostrando imágenes (Ej: "x3 CAPIBARAS PARA SALVARNOS").</p>
            </div>
        </div>

        <div class="col-layout">
            <!-- Equipo 1 Unidades -->
            <div class="team-col" style="border-color: #00ff66;">
                <div><label style="color:#00ff66;" id="lbl-eq1">Nombre Equipo 1</label><input type="text" id="eq1-nombre"></div>
                <div><label style="color:#ccc;">Color de Equipo</label>
                    <div class="color-selector">
                        <input type="color" id="eq1-color" class="color-picker">
                        <input type="text" id="eq1-hex" class="color-hex" maxlength="7">
                    </div>
                </div>
                
                <div><label style="color:#00ff66;"><i class="fa-solid fa-image"></i> URL Imagen de la Unidad</label>
                <input type="text" id="eq1-img" placeholder="Ej: URL del Capibara.png"></div>
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><label style="color:#00ff66;">Unidad Singular</label><input type="text" id="eq1-sing" placeholder="Ej: CAPIBARA"></div>
                    <div style="flex:1;"><label style="color:#00ff66;">Unidad Plural</label><input type="text" id="eq1-plur" placeholder="Ej: CAPIBARAS"></div>
                </div>
                
                <div class="manual-points-box">
                    <div class="mp-header">
                        <span class="mp-title">Unidades Recibidas:</span>
                        <span class="mp-score" id="lbl-pts-eq1-uni" style="color:#00ff66;">0</span>
                    </div>
                    <div class="mp-controls">
                        <input type="number" id="manual-pts-eq1-uni" class="mp-input" placeholder="Añadir unidad (Ej: 1)">
                        <button class="btn-mp" style="background:#00ff66; color:black;" onclick="modificarPuntosUnidades(1, 'sumar')"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>

                <label style="color:#ccc;">Asignar Regalo Físico (Eq 1)</label>
                <div style="display: flex; gap: 10px;"><select id="select-eq1-uni"></select><button class="btn-add" onclick="addGiftUnidades(1)">Añadir</button></div>
                <div class="assigned-list" id="list-eq1-uni"></div>
            </div>

            <!-- Equipo 2 Unidades -->
            <div class="team-col" style="border-color: #ff003c;">
                <div><label style="color:#ff003c;" id="lbl-eq2">Nombre Equipo 2</label><input type="text" id="eq2-nombre"></div>
                <div><label style="color:#ccc;">Color de Equipo</label>
                    <div class="color-selector">
                        <input type="color" id="eq2-color" class="color-picker">
                        <input type="text" id="eq2-hex" class="color-hex" maxlength="7">
                    </div>
                </div>

                <div><label style="color:#ff003c;"><i class="fa-solid fa-image"></i> URL Imagen de la Unidad</label>
                <input type="text" id="eq2-img" placeholder="Ej: URL de la Dona.png"></div>
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;"><label style="color:#ff003c;">Unidad Singular</label><input type="text" id="eq2-sing" placeholder="Ej: DONA"></div>
                    <div style="flex:1;"><label style="color:#ff003c;">Unidad Plural</label><input type="text" id="eq2-plur" placeholder="Ej: DONAS"></div>
                </div>
                
                <div class="manual-points-box">
                    <div class="mp-header">
                        <span class="mp-title">Unidades Recibidas:</span>
                        <span class="mp-score" id="lbl-pts-eq2-uni" style="color:#ff003c;">0</span>
                    </div>
                    <div class="mp-controls">
                        <input type="number" id="manual-pts-eq2-uni" class="mp-input" placeholder="Añadir unidad (Ej: 1)">
                        <button class="btn-mp" style="background:#ff003c; color:white;" onclick="modificarPuntosUnidades(2, 'sumar')"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>

                <label style="color:#ccc;">Asignar Regalo Físico (Eq 2)</label>
                <div style="display: flex; gap: 10px;"><select id="select-eq2-uni"></select><button class="btn-add" onclick="addGiftUnidades(2)">Añadir</button></div>
                <div class="assigned-list" id="list-eq2-uni"></div>
            </div>
        </div>
    </div>

    <div class="box">
        <h3><i class="fa-solid fa-palette"></i> Diseño del Overlay (Unidades)</h3>
        <div class="design-grid">
            <div class="design-item">
                <label style="color:#ccc;">Tipografía y Borde</label>
                <select id="ds-font" style="margin-bottom: 5px;">
                    <option value="'Luckiest Guy', cursive">Luckiest Guy (Gaming)</option>
                    <option value="'Lemon', serif">Lemon (Curvas Gorditas)</option>
                    <option value="'Bebas Neue', cursive">Bebas Neue (Impactante)</option>
                    <option value="'Oswald', sans-serif">Oswald (Fuerte)</option>
                    <option value="'Lilita One', cursive">Lilita One (Gordita)</option>
                    <option value="'Teko', sans-serif">Teko (Tecno)</option>
                    <option value="'Russo One', sans-serif">Russo One (Sci-Fi)</option>
                    <option value="'Anton', sans-serif">Anton (Titular)</option>
                    <option value="'Montserrat', sans-serif">Montserrat (Moderna)</option>
                </select>
                <label style="color:#aaa; font-size:10px;">Grosor Borde Negro</label>
                <input type="number" id="ds-stroke" step="0.5" placeholder="Ej. 1.5">
            </div>

            <div class="design-item">
                <label style="color:#ccc;">Sombras (Text Shadow)</label>
                <label style="color:#aaa; font-size:10px;">Opacidad (0.0 a 1.0)</label>
                <input type="number" id="ds-shadow-op" step="0.1" min="0" max="1" placeholder="Ej. 0.8">
                <label style="color:#aaa; font-size:10px; margin-top:5px;">Distancia de Sombra (px)</label>
                <input type="number" id="ds-shadow-dist" step="1" placeholder="Ej. 4">
            </div>

            <div class="design-item" style="border-top: 3px solid #ffd700;">
                <label style="color:#ffd700;">Línea 1 (Para salvar)</label>
                <label style="color:#aaa; font-size:10px;">Color</label>
                <input type="color" id="ds-c1">
                <label style="color:#aaa; font-size:10px; margin-top:5px;">Tamaño Texto (px)</label>
                <input type="number" id="ds-s1">
            </div>

            <div class="design-item" style="border-top: 3px solid #ff003c;">
                <label style="color:#ff003c;">Línea 2 (Reiniciando en)</label>
                <label style="color:#aaa; font-size:10px;">Color</label>
                <input type="color" id="ds-c2">
                <label style="color:#aaa; font-size:10px; margin-top:5px;">Tamaño Texto (px)</label>
                <input type="number" id="ds-s2">
            </div>

            <div class="design-item" style="border-top: 3px solid #ffffff;">
                <label style="color:#ffffff;">Números (Segundos)</label>
                <label style="color:#aaa; font-size:10px;">Color</label>
                <input type="color" id="ds-ct">
                <label style="color:#aaa; font-size:10px; margin-top:5px;">Tamaño Texto (px)</label>
                <input type="number" id="ds-st">
            </div>
        </div>

        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button class="btn-guardar" onclick="guardarConfig(false)" style="flex: 2;"><i class="fa-solid fa-floppy-disk"></i> Guardar Todo en Vivo</button>
        </div>

        <div class="overlay-bar">
            <button class="btn-overlay" onclick="window.open('/versus_unidades', '_blank')"><i class="fa-solid fa-eye"></i> Abrir Overlay Unidades</button>
            <button class="btn-overlay" onclick="copiarURL('/versus_unidades')"><i class="fa-solid fa-link"></i> Copiar URL Unidades</button>
        </div>
        
        <p id="mensaje" style="color:#00ff66; text-align:center; display:none; font-weight:bold;">✅ ¡Guardado y Aplicado!</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let globalGifts = []; let eq1GiftsUni = []; let eq2GiftsUni = [];
        
        function syncColors(pickerId, hexId, labelId) {
            const picker = document.getElementById(pickerId);
            const hex = document.getElementById(hexId);
            const lbl = document.getElementById(labelId);
            picker.addEventListener('input', (e) => { hex.value = e.target.value.toUpperCase(); lbl.style.color = e.target.value; });
            hex.addEventListener('input', (e) => { let val = e.target.value; if(/^#[0-9A-F]{6}$/i.test(val)) { picker.value = val; lbl.style.color = val; } });
        }
        syncColors('eq1-color', 'eq1-hex', 'lbl-eq1');
        syncColors('eq2-color', 'eq2-hex', 'lbl-eq2');

        function renderDropdowns() {
            let u1 = document.getElementById('select-eq1-uni'); 
            let u2 = document.getElementById('select-eq2-uni');
            let vu1 = u1.value; let vu2 = u2.value;
            u1.innerHTML = ''; u2.innerHTML = '';
            
            globalGifts.forEach(g => { 
                let enU1 = eq1GiftsUni.some(r => r.id === g.id);
                let enU2 = eq2GiftsUni.some(r => r.id === g.id);
                
                let styleBg = ""; let textoAdd = "";
                if (enU1) { styleBg = "background-color: #004d00; color: #00ff66;"; textoAdd = " ✅ [Eq 1]"; } 
                else if (enU2) { styleBg = "background-color: #4d0012; color: #ff003c;"; textoAdd = " ✅ [Eq 2]"; }
                
                let optUni = `<option value="${g.id}" style="${styleBg}">[ID: ${g.id}] ${g.name} (${g.diamonds} Monedas)${textoAdd}</option>`; 
                u1.innerHTML += optUni; u2.innerHTML += optUni; 
            });

            if(vu1) u1.value = vu1; if(vu2) u2.value = vu2;
        }

        socket.on('config_actual', (config) => {
            let uConf = config.unidades;
            if(!uConf) return;

            document.getElementById('input-countdown-sec').value = uConf.countdownSeconds || 30;
            document.getElementById('check-countdown').checked = uConf.enableCountdown;
            
            document.getElementById('eq1-nombre').value = uConf.equipo1.nombre || ""; 
            document.getElementById('eq1-sing').value = uConf.equipo1.nombreSingular || ""; 
            document.getElementById('eq1-plur').value = uConf.equipo1.nombrePlural || ""; 
            document.getElementById('eq1-img').value = uConf.equipo1.imgUnidad || ""; 

            document.getElementById('eq2-nombre').value = uConf.equipo2.nombre || ""; 
            document.getElementById('eq2-sing').value = uConf.equipo2.nombreSingular || ""; 
            document.getElementById('eq2-plur').value = uConf.equipo2.nombrePlural || ""; 
            document.getElementById('eq2-img').value = uConf.equipo2.imgUnidad || ""; 
            
            let c1 = uConf.equipo1.color || "#00ff66";
            let c2 = uConf.equipo2.color || "#ff003c";
            document.getElementById('eq1-color').value = c1; document.getElementById('eq1-hex').value = c1.toUpperCase(); document.getElementById('lbl-eq1').style.color = c1;
            document.getElementById('eq2-color').value = c2; document.getElementById('eq2-hex').value = c2.toUpperCase(); document.getElementById('lbl-eq2').style.color = c2;

            if(uConf.battleStyle) {
                document.getElementById('ds-font').value = uConf.battleStyle.fontFamily;
                document.getElementById('ds-stroke').value = uConf.battleStyle.textStroke;
                document.getElementById('ds-shadow-op').value = uConf.battleStyle.shadowOpacity !== undefined ? uConf.battleStyle.shadowOpacity : 1.0;
                document.getElementById('ds-shadow-dist').value = uConf.battleStyle.shadowDistance !== undefined ? uConf.battleStyle.shadowDistance : 4;
                document.getElementById('ds-c1').value = uConf.battleStyle.colorL1;
                document.getElementById('ds-s1').value = uConf.battleStyle.sizeL1;
                document.getElementById('ds-c2').value = uConf.battleStyle.colorL2;
                document.getElementById('ds-s2').value = uConf.battleStyle.sizeL2;
                document.getElementById('ds-ct').value = uConf.battleStyle.colorTimer;
                document.getElementById('ds-st').value = uConf.battleStyle.sizeTimer;
            }

            globalGifts = config.regalosDisponibles || []; 
            eq1GiftsUni = uConf.equipo1.regalos || []; eq2GiftsUni = uConf.equipo2.regalos || [];
            
            renderDropdowns();
            renderListUni(1); renderListUni(2);
        });

        socket.on('actualizacion_unidades', (data) => {
            document.getElementById('lbl-pts-eq1-uni').innerText = data.totalSalvar;
            document.getElementById('lbl-pts-eq2-uni').innerText = data.totalReiniciar;
        });

        function modificarPuntosUnidades(equipo, accion) {
            let inputId = equipo === 1 ? 'manual-pts-eq1-uni' : 'manual-pts-eq2-uni';
            let pts = parseInt(document.getElementById(inputId).value);
            if (isNaN(pts) || pts <= 0) return;
            let cantidad = accion === 'sumar' ? pts : -pts;
            socket.emit('modificar_puntos_unidades', { equipo: equipo, cantidad: cantidad });
        }

        function resetearValores() {
            if(confirm("🚨 ¿Estás seguro de reiniciar todos los puntos de unidades a cero?")) {
                socket.emit('reset_unidades');
            }
        }

        function renderListUni(team) {
            let container = document.getElementById(team === 1 ? 'list-eq1-uni' : 'list-eq2-uni');
            let arr = team === 1 ? eq1GiftsUni : eq2GiftsUni; container.innerHTML = '';
            arr.forEach(g => { container.innerHTML += `<div class="assigned-item"><span>${g.name}</span><button class="btn-remove" onclick="removeGiftUni(${team}, ${g.id})"><i class="fa-solid fa-xmark"></i></button></div>`; });
        }

        function addGiftUnidades(team) {
            let sel = document.getElementById(team === 1 ? 'select-eq1-uni' : 'select-eq2-uni');
            if(!sel.value) return;
            let gift = globalGifts.find(g => g.id === parseInt(sel.value));
            let arr = team === 1 ? eq1GiftsUni : eq2GiftsUni;
            if (!arr.some(g => g.id === gift.id)) { arr.push(gift); renderListUni(team); renderDropdowns(); guardarConfig(true); }
        }

        function removeGiftUni(team, id) {
            if (team === 1) eq1GiftsUni = eq1GiftsUni.filter(g => g.id !== id); else eq2GiftsUni = eq2GiftsUni.filter(g => g.id !== id);
            renderListUni(team); renderDropdowns(); guardarConfig(true); 
        }

        function guardarConfig(isSilent = false) {
            let configStyle = {
                fontFamily: document.getElementById('ds-font').value,
                textStroke: parseFloat(document.getElementById('ds-stroke').value) || 1.5,
                shadowOpacity: parseFloat(document.getElementById('ds-shadow-op').value),
                shadowDistance: parseInt(document.getElementById('ds-shadow-dist').value) || 4,
                colorL1: document.getElementById('ds-c1').value,
                sizeL1: parseInt(document.getElementById('ds-s1').value) || 38,
                colorL2: document.getElementById('ds-c2').value,
                sizeL2: parseInt(document.getElementById('ds-s2').value) || 45,
                colorTimer: document.getElementById('ds-ct').value,
                sizeTimer: parseInt(document.getElementById('ds-st').value) || 140
            };

            let c1 = document.getElementById('eq1-hex').value;
            let c2 = document.getElementById('eq2-hex').value;

            let configUnidades = {
                equipo1: { nombre: document.getElementById('eq1-nombre').value.trim(), nombreSingular: document.getElementById('eq1-sing').value.trim(), nombrePlural: document.getElementById('eq1-plur').value.trim(), color: c1, imgUnidad: document.getElementById('eq1-img').value.trim(), regalos: eq1GiftsUni },
                equipo2: { nombre: document.getElementById('eq2-nombre').value.trim(), nombreSingular: document.getElementById('eq2-sing').value.trim(), nombrePlural: document.getElementById('eq2-plur').value.trim(), color: c2, imgUnidad: document.getElementById('eq2-img').value.trim(), regalos: eq2GiftsUni },
                enableCountdown: document.getElementById('check-countdown').checked, 
                countdownSeconds: parseInt(document.getElementById('input-countdown-sec').value) || 30,
                battleStyle: configStyle
            };

            socket.emit('guardar_config_unidades', configUnidades);
            
            if (!isSilent) {
                document.getElementById('mensaje').style.display = 'block'; 
                setTimeout(() => document.getElementById('mensaje').style.display = 'none', 2000);
            }
        }

        function copiarURL(path) {
            navigator.clipboard.writeText(window.location.origin + path);
            alert("✅ Enlace copiado: " + window.location.origin + path + "\n\nPégalo como Navegador en OBS.");
        }
    </script>
</body>
</html>
