<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0f13; color: white; font-family: 'Segoe UI', sans-serif; padding: 40px; margin: 0; }
        .box { background: #1a1a24; border: 1px solid #333; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); max-width: 1000px;}
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #222; padding: 15px; border-radius: 8px;}
        
        .racha-layout { display: flex; gap: 20px; align-items: flex-start;}
        .racha-col { flex: 1; background: #222; border: 1px solid #444; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; max-height: 500px;}
        .racha-col h3 { text-align: center; margin-top: 0; font-size: 16px; color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; text-transform: uppercase;}
        
        .user-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px;}
        .user-list::-webkit-scrollbar { width: 5px; }
        .user-list::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        .user-item { background: #111; padding: 10px; border-radius: 8px; border: 1px solid #333; display: flex; align-items: center; justify-content: space-between; gap: 10px;}
        .user-info { display: flex; align-items: center; gap: 10px; overflow: hidden;}
        .user-info img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover;}
        .user-info div { display: flex; flex-direction: column; }
        .u-name { font-weight: bold; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;}
        .u-data { font-size: 12px; font-weight: bold;}
        
        .btn-ctrl { background: #333; border: none; color: white; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center;}
        .btn-ctrl:hover { background: #555;}
        .btn-del { color: #ff003c; }
        .btn-del:hover { background: #ff003c; color: white; }

        .btn-clear { background: #444; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px;}
        .btn-clear:hover { background: #ff003c; }

        .btn-action { width: 100%; padding: 10px; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; text-transform: uppercase; margin-top: 10px; font-size: 13px;}

        .btn-overlay { padding: 10px 15px; background: #222; color: #00f2fe; font-size: 13px; font-weight: bold; border: 1px solid #00f2fe; cursor: pointer; border-radius: 8px;}
        .btn-overlay:hover { background: #00f2fe; color: black;}

        .search-bar { width: 100%; background: #111; border: 1px solid #555; color: #fff; border-radius: 6px; padding: 10px 12px; font-size: 13px; box-sizing: border-box; margin-bottom: 10px; }
        .search-bar:focus { outline: none; border-color: #00f2fe; }
    </style>
</head>
<body>
    <div class="box">
        <div class="top-row">
            <div style="display:flex; flex-direction:column; gap: 10px;">
                <div style="display:flex; gap: 20px; align-items:center;">
                    <label style="cursor: pointer; font-weight: bold; color:#aaa;"><input type="checkbox" id="opt-name" onchange="guardarOpts()"> Mostrar Nombre</label>
                    <label style="cursor: pointer; font-weight: bold; color:#aaa;"><input type="checkbox" id="opt-count" onchange="guardarOpts()"> Mostrar Victorias</label>
                    <label style="cursor: pointer; font-weight: bold; color:#aaa;"><input type="checkbox" id="opt-coins" onchange="guardarOpts()"> Mostrar Monedas</label>
                </div>
            </div>
            <div style="display:flex; gap: 10px;">
                <!-- 🌟 NUEVO BOTÓN: LIMPIAR VISUALMENTE -->
                <button class="btn-overlay" style="color:#0099ff; border-color:#0099ff;" onclick="limpiarVisual()"><i class="fa-solid fa-eye-slash"></i> Limpiar Overlay (Visual)</button>
                <button class="btn-overlay" onclick="window.open('/racha_versus', '_blank')"><i class="fa-solid fa-eye"></i> Ver Overlay</button>
                <button class="btn-overlay" onclick="copiarURL()"><i class="fa-solid fa-link"></i> Copiar URL OBS</button>
            </div>
        </div>

        <!-- 🌟 BUSCADOR GLOBAL -->
        <input type="text" id="buscador-historial" class="search-bar" placeholder="🔍 Buscar usuario en los historiales de racha...">

        <div class="racha-layout">
            <div class="racha-col" style="border-color: #00ff66;">
                <h3 style="color:#00ff66;"><i class="fa-solid fa-shield-halved"></i> Récord de Salvadores (Eq 1)</h3>
                <div class="user-list" id="lista-salvadas"></div>
                <div><button class="btn-clear" onclick="limpiarRacha('salvadas')"><i class="fa-solid fa-trash"></i> Limpiar Base de Datos</button></div>
            </div>

            <div class="racha-col" style="border-color: #ff003c;">
                <h3 style="color:#ff003c;"><i class="fa-solid fa-rotate-left"></i> Récord de Reinicios (Eq 2)</h3>
                <div class="user-list" id="lista-reinicios"></div>
                <div><button class="btn-clear" onclick="limpiarRacha('reinicios')"><i class="fa-solid fa-trash"></i> Limpiar Base de Datos</button></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // Variables para la carga progresiva y buscador
        let arrSalvGlobal = []; 
        let arrReinGlobal = []; 
        let limitSalvar = 20; 
        let limitReiniciar = 20; 
        let filtroTexto = ""; 

        document.getElementById('buscador-historial').addEventListener('input', (e) => {
            filtroTexto = e.target.value.toLowerCase();
            limitSalvar = 20;
            limitReiniciar = 20;
            renderListas();
        });

        socket.on('racha_versus_update', (data) => {
            if(!data) return;
            
            document.getElementById('opt-name').checked = data.showName !== false;
            document.getElementById('opt-count').checked = data.showCount !== false;
            document.getElementById('opt-coins').checked = data.showCoins !== false;

            arrSalvGlobal = Object.values(data.salvadas || {}).sort((a,b) => b.count - a.count);
            arrReinGlobal = Object.values(data.reinicios || {}).sort((a,b) => b.count - a.count);
            
            renderListas();
        });

        function renderListas() {
            // --- LISTA SALVADAS ---
            let lSalv = document.getElementById('lista-salvadas'); 
            lSalv.innerHTML = '';
            
            let filtradosSalv = arrSalvGlobal.filter(u => u.displayName.toLowerCase().includes(filtroTexto));
            let mostrarSalv = filtradosSalv.slice(0, limitSalvar);

            mostrarSalv.forEach(u => {
                let rank = arrSalvGlobal.findIndex(x => x.displayName === u.displayName) + 1;
                lSalv.innerHTML += `
                <div class="user-item">
                    <div class="user-info">
                        <span style="font-weight:900; color:#888; width:20px;">#${rank}</span>
                        <img src="${u.avatar}">
                        <div><span class="u-name">${u.displayName}</span><span class="u-data" style="color:#00ff66;">${u.count} SALVADAS | <i class="fa-solid fa-coins"></i> ${u.monedas || 0}</span></div>
                    </div>
                    <div style="display:flex;gap:5px;">
                        <button class="btn-ctrl" onclick="ajustarWin('salvadas','${u.displayName}',-1)">-</button>
                        <button class="btn-ctrl" onclick="ajustarWin('salvadas','${u.displayName}',1)">+</button>
                        <button class="btn-ctrl btn-del" onclick="eliminarUser('salvadas','${u.displayName}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            });
            if (limitSalvar < filtradosSalv.length) {
                lSalv.innerHTML += `<button class="btn-action" style="background:#2a2a35; color:#fff; border: 1px solid #444;" onclick="cargarMas('salvadas')">Cargar más</button>`;
            }

            // --- LISTA REINICIOS ---
            let lRein = document.getElementById('lista-reinicios'); 
            lRein.innerHTML = '';
            
            let filtradosRein = arrReinGlobal.filter(u => u.displayName.toLowerCase().includes(filtroTexto));
            let mostrarRein = filtradosRein.slice(0, limitReiniciar);

            mostrarRein.forEach(u => {
                let rank = arrReinGlobal.findIndex(x => x.displayName === u.displayName) + 1;
                lRein.innerHTML += `
                <div class="user-item">
                    <div class="user-info">
                        <span style="font-weight:900; color:#888; width:20px;">#${rank}</span>
                        <img src="${u.avatar}">
                        <div><span class="u-name">${u.displayName}</span><span class="u-data" style="color:#ff003c;">${u.count} REINICIOS | <i class="fa-solid fa-coins"></i> ${u.monedas || 0}</span></div>
                    </div>
                    <div style="display:flex;gap:5px;">
                        <button class="btn-ctrl" onclick="ajustarWin('reinicios','${u.displayName}',-1)">-</button>
                        <button class="btn-ctrl" onclick="ajustarWin('reinicios','${u.displayName}',1)">+</button>
                        <button class="btn-ctrl btn-del" onclick="eliminarUser('reinicios','${u.displayName}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            });
            if (limitReiniciar < filtradosRein.length) {
                lRein.innerHTML += `<button class="btn-action" style="background:#2a2a35; color:#fff; border: 1px solid #444;" onclick="cargarMas('reinicios')">Cargar más</button>`;
            }
        }

        function cargarMas(tipo) {
            if (tipo === 'salvadas') limitSalvar += 20;
            if (tipo === 'reinicios') limitReiniciar += 20;
            renderListas();
        }

        function ajustarWin(tipo, nombre, cant) { socket.emit('racha_versus_ajuste', { tipo: tipo, name: nombre, amount: cant }); }
        
        function eliminarUser(tipo, nombre) {
            if(confirm(`¿Eliminar a ${nombre} del récord de ${tipo}?`)) socket.emit('racha_versus_eliminar', { tipo: tipo, name: nombre });
        }
        function limpiarRacha(tipo) { 
            if(confirm(`🚨 PELIGRO: ¿Borrar la BASE DE DATOS histórica de ${tipo}? (Esto no se puede deshacer)`)) socket.emit('racha_versus_limpiar', tipo); 
        }

        // 🌟 NUEVA FUNCIÓN VISUAL
        function limpiarVisual() {
            if(confirm(`👁️ ¿Ocultar a los ganadores actuales de la pantalla del stream?\n(No borrará el historial, solo los desaparecerá de OBS hasta la próxima batalla)`)) {
                socket.emit('racha_versus_clear_visual');
            }
        }
        
        function guardarOpts() { 
            socket.emit('racha_versus_guardar_opciones', { 
                showName: document.getElementById('opt-name').checked, 
                showCount: document.getElementById('opt-count').checked, 
                showCoins: document.getElementById('opt-coins').checked
            }); 
        }
        
        function copiarURL() { navigator.clipboard.writeText(window.location.origin + '/racha_versus'); alert("✅ Enlace copiado!"); }
    </script>
</body>
</html>
