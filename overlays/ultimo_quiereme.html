<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
        
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: transparent; 
            font-family: 'Montserrat', sans-serif;
            /* CENTRADO ABSOLUTO EN TODA LA PANTALLA */
            display: flex; 
            justify-content: center; 
            align-items: center;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }

        /* 🌟 CONTENEDOR DE PARTÍCULAS */
        .hearts-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            animation: floatUp linear forwards;
            filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.9));
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.8) rotate(60deg); opacity: 0; }
        }

        /* 🌟 CONTENEDOR PRINCIPAL (INICIA INVISIBLE) */
        .social-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            animation: floatUI 4s ease-in-out infinite;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Modificaciones para que inicie oculto */
            opacity: 0;
            transform: scale(0.5) translateY(-50px);
        }

        @keyframes floatUI {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* 🌟 PLACA DEL TÍTULO */
        .title-badge {
            background: rgba(20, 10, 15, 0.95);
            border: 2px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 1);
            border-radius: 20px;
            padding: 8px 25px;
            color: #ff4fd8;
            font-size: 18px; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: -20px; 
            z-index: 15;
            text-shadow: 0 0 10px rgba(255, 79, 216, 1);
        }

        .heart-icon { animation: beat 0.6s infinite; }
        @keyframes beat { 
            0%, 100% { transform: scale(1); } 
            50% { transform: scale(1.4); } 
        }

        /* 🌟 FOTO DE PERFIL CIRCULAR CON EFECTOS */
        .avatar-wrap {
            position: relative;
            width: 190px; 
            height: 190px;
            border-radius: 50%;
            z-index: 10;
        }

        .avatar-wrap::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 8px solid #ff0055;
            animation: shockwave 1.2s ease-out infinite;
            z-index: -1;
        }

        @keyframes shockwave {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #ff4fd8;
            box-sizing: border-box;
            background-color: #222;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 0, 85, 0.8);
            animation: beatAvatar 0.6s infinite;
        }

        @keyframes beatAvatar {
            0%, 100% { transform: scale(1); border-color: #ff4fd8; }
            50% { transform: scale(1.05); border-color: #ff0055; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 60px rgba(255, 0, 85, 1); }
        }

        /* 🌟 NOMBRE ESTILO 3D ROMÁNTICO + ANIMACIÓN GLOW */
        .name {
            margin-top: 30px;
            font-size: 65px; 
            font-weight: 900;
            color: #ffffff; 
            text-transform: capitalize;
            letter-spacing: 3px;
            text-align: center;
            max-width: 95vw; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 
                0px 2px 0px #ff4fd8,
                0px 4px 0px #e60073,
                0px 6px 0px #cc0066,
                0px 8px 0px #b30059,
                0px 10px 0px #99004d,
                0px 12px 0px #800040,
                0px 15px 25px rgba(0,0,0,0.9),
                0px 0px 35px rgba(255, 0, 85, 0.9);
            z-index: 12;
            padding: 0 20px;
            animation: textPulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes textPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.08); filter: brightness(1.2); }
        }

    </style>
</head>
<body>

    <!-- Capa de corazones flotantes -->
    <div class="hearts-bg" id="hearts-bg"></div>

    <div class="social-container" id="social-box">
        <div class="title-badge"><i class="fa-solid fa-heart heart-icon"></i> Último Quiéreme</div>
        <div class="avatar-wrap">
            <img id="q-avatar" class="avatar" src="https://via.placeholder.com/150/222/fff?text=?">
        </div>
        <div class="name" id="q-name">Esperando</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let hideTimeout;

        // 🌟 SISTEMA DE PARTÍCULAS
        const heartsContainer = document.getElementById('hearts-bg');
        const heartColors = ['#ff0055', '#ff4fd8', '#ff99cc', '#ff1493', '#ff003c', '#ffffff'];

        function spawnHeart() {
            const heart = document.createElement('i');
            heart.classList.add('fa-solid', 'fa-heart', 'floating-heart');
            
            const size = Math.random() * 30 + 15; // 15px a 45px
            const left = Math.random() * 100; // Por toda la pantalla
            const duration = Math.random() * 1.5 + 1.2; // 1.2s a 2.7s
            const color = heartColors[Math.floor(Math.random() * heartColors.length)];

            heart.style.fontSize = `${size}px`;
            heart.style.left = `${left}%`;
            heart.style.color = color;
            heart.style.animationDuration = `${duration}s`;

            heartsContainer.appendChild(heart);

            setTimeout(() => {
                if (heartsContainer.contains(heart)) {
                    heartsContainer.removeChild(heart);
                }
            }, duration * 1000);
        }

        // Explosión de 150 corazones distribuidos a lo largo de 1.8 segundos
        function heartBurst() {
            for (let i = 0; i < 150; i++) {
                setTimeout(spawnHeart, Math.random() * 1800); 
            }
        }

        // 🌟 LÓGICA DEL POP-UP
        socket.on('update_ultimo_quiereme', (data) => {
            if(!data || data.name === "ESPERANDO...") return;
            
            let box = document.getElementById('social-box');
            
            // 1. Actualizar la información
            document.getElementById('q-avatar').src = data.avatar;
            let shortName = data.name.split(' ')[0]; // Solo el primer nombre
            document.getElementById('q-name').innerText = shortName;
            
            // 2. Mostrar la animación de entrada
            box.style.transform = 'scale(1) translateY(0px)';
            box.style.opacity = '1';
            
            // 3. Disparar la tormenta de corazones
            heartBurst();

            // 4. Limpiar cualquier temporizador anterior
            clearTimeout(hideTimeout);

            // 5. Ocultar foto y nombre en exactamente 1 segundo (1000 ms)
            hideTimeout = setTimeout(() => {
                box.style.transform = 'scale(0.5) translateY(-50px)';
                box.style.opacity = '0';
            }, 1000);
        });
    </script>
</body>
</html>
